name: Pipeline

on:
  push:
    branches: [ master ]

jobs:
  tests:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx  # httpx нужен для TestClient в FastAPI
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Pytest
        run: |
          pytest -vv


  deploy-docker:
    runs-on: self-hosted
    needs: tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Run Docker Containers
        run: |
          docker compose -f .\docker\docker-compose.yaml up --build -d
          docker image prune -f